function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function open_(pw){
 var raw=b64(DATA), salt=raw.slice(8,16), ct=raw.slice(16);
 var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},k,384));
 var key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,ct);
 return new TextDecoder().decode(pt);
}
async function go(pw,remember){
 document.getElementById("b").textContent="Abrindo…";
 try{var html=await open_(pw);
  try{if(remember)localStorage.setItem(KEY,pw);else localStorage.removeItem(KEY)}catch(x){}
  document.open();document.write(html);document.close();
 }catch(x){document.getElementById("e").textContent="Senha incorreta. Confira e tente de novo.";document.getElementById("b").textContent="Abrir apresentação";try{localStorage.removeItem(KEY)}catch(y){}}
}
